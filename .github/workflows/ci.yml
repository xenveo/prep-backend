# Backend CI (plan production-readiness/05 "CI"). Tests use fake LLM/STT/TTS and console mail
# (vitest.config.e2e.ts forces them), so no provider keys or secrets are needed here.
name: CI

on:
  push:
    branches: [main, kartik]
  pull_request:
    branches: [main, kartik]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local toolchain (@types/node 24); package.json has no engines field yet.
  NODE_VERSION: 24

jobs:
  unit:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # postinstall runs `prisma generate`, which needs no DATABASE_URL.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (in-memory queue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prep_db_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d prep_db_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prep_db_e2e?schema=public
      # Dummy value for the env schema (min 16 chars). Not a secret.
      AUTH_SECRET: ci-only-dummy-auth-secret-000000
      PUBLIC_API_URL: http://localhost:3000
      APP_CANDIDATE_ORIGIN: http://localhost:3001
      APP_ADMIN_ORIGIN: http://localhost:3002
      MAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:e2e

  e2e-redis:
    name: E2E (BullMQ on Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prep_db_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d prep_db_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prep_db_e2e?schema=public
      REDIS_URL: redis://localhost:6379/0
      REDIS_PREFIX: preppilot-e2e
      # Dummy value for the env schema (min 16 chars). Not a secret.
      AUTH_SECRET: ci-only-dummy-auth-secret-000000
      PUBLIC_API_URL: http://localhost:3000
      APP_CANDIDATE_ORIGIN: http://localhost:3001
      APP_ADMIN_ORIGIN: http://localhost:3002
      MAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:e2e
